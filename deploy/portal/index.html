<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>turmony 导航</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f7fc;
  --hero-bg: linear-gradient(145deg, #eaf1fe 0%, #f5f2ff 55%, #eef7f4 100%);
  --hero-border: #d9e3f4;
  --surface: #ffffff;
  --surface-hover: #f2f6fd;
  --surface-active: #e7effb;
  --border: #dfe5f0;
  --border-hover: #b6c9ea;
  --fg: #181a1f;
  --dim: #434750;
  --muted: #5d626d;
  --primary: #0b57d0;
  --primary-fg: #ffffff;
  --ok-dot: #188038;
  --ok-bg: #d9f2e1;
  --ok-fg: #0d652d;
  --action-bg: #eef2f9;
  --action-fg: #3b4048;
  --shadow: 0 1px 2px rgba(24, 34, 56, .05), 0 6px 16px rgba(24, 34, 56, .04);
  --shadow-hover: 0 4px 12px rgba(11, 87, 208, .10), 0 12px 28px rgba(24, 34, 56, .08);

  --tone-blue-bg: #d3e3fd;
  --tone-blue-fg: #0b57d0;
  --tone-green-bg: #c4eed0;
  --tone-green-fg: #0f6d31;
  --tone-amber-bg: #fee5a5;
  --tone-amber-fg: #9a4d00;
  --tone-purple-bg: #e8ddff;
  --tone-purple-fg: #5e35b1;
  --tone-teal-bg: #bce9f4;
  --tone-teal-fg: #005f73;

  --spring: cubic-bezier(.22, 1.4, .36, 1);
  --ease-m3: cubic-bezier(.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0f11;
    --hero-bg: linear-gradient(145deg, #1b2230 0%, #1d1a29 55%, #16211d 100%);
    --hero-border: #2c313b;
    --surface: #1b1c1f;
    --surface-hover: #24262b;
    --surface-active: #2c2f36;
    --border: #2a2d33;
    --border-hover: #495264;
    --fg: #f0f2f5;
    --dim: #c3c7d1;
    --muted: #9398a3;
    --primary: #8ab4f8;
    --primary-fg: #062e6f;
    --ok-dot: #5bb974;
    --ok-bg: rgba(91, 185, 116, .18);
    --ok-fg: #81c995;
    --action-bg: #262930;
    --action-fg: #c9cdd6;
    --shadow: 0 2px 6px rgba(0, 0, 0, .35), 0 8px 20px rgba(0, 0, 0, .25);
    --shadow-hover: 0 6px 18px rgba(0, 0, 0, .48), 0 12px 30px rgba(0, 0, 0, .34);

    --tone-blue-bg: rgba(138, 180, 248, .20);
    --tone-blue-fg: #8ab4f8;
    --tone-green-bg: rgba(91, 185, 116, .20);
    --tone-green-fg: #5bb974;
    --tone-amber-bg: rgba(253, 214, 99, .20);
    --tone-amber-fg: #fdd663;
    --tone-purple-bg: rgba(197, 138, 249, .20);
    --tone-purple-fg: #c58af9;
    --tone-teal-bg: rgba(78, 205, 230, .20);
    --tone-teal-fg: #4ecde6;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 "Google Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
}
main {
  width: 100%;
  max-width: 840px;
  padding: 24px 16px 48px;
}
@media (min-width: 640px) {
  main { padding: 44px 24px 60px; }
}
header.hero {
  background: var(--hero-bg);
  border: 1px solid var(--hero-border);
  border-radius: 32px;
  padding: 22px 22px 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
@media (min-width: 640px) {
  header.hero { padding: 28px 30px 30px; }
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.brand-row {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  letter-spacing: .01em;
}
.m3-marks {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.m3-marks i { display: block; width: 8px; height: 8px; }
.m-circle { border-radius: 50%; background: #4285f4; }
.m-square { border-radius: 2px; background: #ea4335; }
.m-pill { width: 12px !important; border-radius: 999px; background: #fbbc04; }
.m-diamond { border-radius: 2px; transform: rotate(45deg) scale(.85); background: #34a853; }

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--ok-bg);
  color: var(--ok-fg);
}
.status-chip::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok-dot);
}
h1 {
  margin: 0 0 6px;
  font-size: clamp(34px, 8vw, 44px);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.08;
}
.sub {
  margin: 0;
  color: var(--dim);
  font-size: 14px;
}
.section-label {
  margin: 0 0 10px 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--muted);
}
section + section {
  margin-top: 24px;
}
ul.grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 4px;
}
a.card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
  min-width: 0;
  transition:
    background-color .22s var(--ease-m3),
    border-color .22s var(--ease-m3),
    border-radius .36s var(--spring),
    transform .36s var(--spring),
    box-shadow .28s var(--ease-m3);
}
/* M3 Expressive Segmented Stack on mobile */
@media (max-width: 639px) {
  ul.grid.two-col li:first-child a.card { border-radius: 28px 28px 10px 10px; }
  ul.grid.two-col li:not(:first-child):not(:last-child) a.card { border-radius: 10px; }
  ul.grid.two-col li:last-child a.card { border-radius: 10px 10px 28px 28px; }
  ul.grid.two-col li a.card:hover,
  ul.grid.two-col li a.card:active {
    border-radius: 22px;
  }
}
@media (min-width: 640px) {
  ul.grid.two-col {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  a.card:hover {
    border-radius: 22px;
    transform: translateY(-2px);
  }
}
a.card:hover {
  background: var(--surface-hover);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-hover);
}
a.card:active {
  background: var(--surface-active);
  transform: scale(.985);
}
a.card:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.mark {
  flex: none;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  transition: transform .42s var(--spring), border-radius .36s var(--spring);
}
.mark svg {
  width: 24px;
  height: 24px;
}
.shape-squircle { border-radius: 18px; }
.shape-shield { border-radius: 22px 22px 14px 14px; }

a.card:hover .mark {
  transform: scale(1.08) rotate(-4deg);
}
a.card:active .mark {
  transform: scale(.95);
}

.tone-blue { background: var(--tone-blue-bg); color: var(--tone-blue-fg); }
.tone-green { background: var(--tone-green-bg); color: var(--tone-green-fg); }
.tone-amber { background: var(--tone-amber-bg); color: var(--tone-amber-fg); }
.tone-purple { background: var(--tone-purple-bg); color: var(--tone-purple-fg); }
.tone-teal { background: var(--tone-teal-bg); color: var(--tone-teal-fg); }

.text {
  min-width: 0;
  flex: 1;
}
.name {
  display: block;
  font-weight: 700;
  font-size: 16px;
  line-height: 1.3;
  letter-spacing: -.01em;
  color: var(--fg);
}
.desc {
  display: block;
  color: var(--dim);
  font-size: 13px;
  line-height: 1.45;
  margin-top: 3px;
}
.go {
  flex: none;
  width: 42px;
  height: 34px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--action-bg);
  color: var(--action-fg);
  transition: transform .36s var(--spring), width .36s var(--spring), background-color .2s var(--ease-m3), color .2s var(--ease-m3);
}
.go svg {
  width: 18px;
  height: 18px;
}
a.card:hover .go {
  width: 48px;
  background: var(--primary);
  color: var(--primary-fg);
  transform: translateX(2px);
}
@media (prefers-reduced-motion: reduce) {
  a.card, .mark, .go { transition: none; }
}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="topbar">
      <div class="brand-row">
        <span class="m3-marks" aria-hidden="true">
          <i class="m-circle"></i><i class="m-square"></i><i class="m-pill"></i><i class="m-diamond"></i>
        </span>
        <span>turmony 工作台</span>
      </div>
      <span class="status-chip">统一凭证通行中</span>
    </div>
    <h1>turmony</h1>
    <p class="sub">选择一个控制台入口，或管理你的全站登录凭证。</p>
  </header>

  <section aria-labelledby="sec-services">
    <p id="sec-services" class="section-label">服务与控制台</p>
    <ul class="grid two-col">
      <li><a class="card" href="/review/">
        <span class="mark shape-squircle tone-blue" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            <path d="M8 7h8M8 11h6"/>
          </svg>
        </span>
        <span class="text">
          <span class="name">JLPT 学习站</span>
          <span class="desc">日语记忆、试卷练习与新闻阅读</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </a></li>

      <li><a class="card" href="/vpn-admin/">
        <span class="mark shape-shield tone-green" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <span class="text">
          <span class="name">VPN 管理</span>
          <span class="desc">节点、用户与流量</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </a></li>

      <li><a class="card" href="/workbuddy-manager/">
        <span class="mark shape-squircle tone-purple" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6V3"/>
            <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
            <rect x="5" y="6" width="14" height="13" rx="4"/>
            <path d="M3 11v3M21 11v3"/>
            <circle cx="9.5" cy="11.5" r="1" fill="currentColor"/>
            <circle cx="14.5" cy="11.5" r="1" fill="currentColor"/>
            <path d="M9.5 15.2c.8.8 1.6 1.1 2.5 1.1s1.7-.3 2.5-1.1"/>
          </svg>
        </span>
        <span class="text">
          <span class="name">WorkBuddy 管理</span>
          <span class="desc">CodeBuddy 账号池与 OpenAI 网关</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </a></li>
    </ul>
  </section>

  <section aria-labelledby="sec-security">
    <p id="sec-security" class="section-label">账号与安全</p>
    <ul class="grid">
      <li><a class="card" href="/account/">
        <span class="mark shape-squircle tone-teal" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="14" r="4"/>
            <path d="M10.8 11.2 19 3m-3 3 2 2m-4.5-2.5 2 2"/>
          </svg>
        </span>
        <span class="text">
          <span class="name">凭证管理</span>
          <span class="desc">查看已登录设备与 Cookie、在线修改主站密码或退出登录</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </a></li>
    </ul>
  </section>
</main>
</body>
</html>
