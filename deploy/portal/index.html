<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>turmony 导航</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7fb;
  --panel: #ffffff;
  --line: #e3e6ee;
  --fg: #151a2b;
  --dim: #667085;
  --accent: #3b5bdb;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1118;
    --panel: #171b26;
    --line: #262c3b;
    --fg: #e8ebf3;
    --dim: #94a0b8;
    --accent: #8ea2ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  justify-content: center;
}
main {
  width: 100%;
  max-width: 720px;
  padding: 56px 16px 40px;
}
h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: .02em; }
.sub { margin: 0 0 28px; color: var(--dim); font-size: 14px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
  transition: transform .12s ease, border-color .12s ease;
}
a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mark {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}
.text { min-width: 0; flex: 1; }
.name { display: block; font-weight: 600; font-size: 17px; }
.desc { display: block; color: var(--dim); font-size: 13px; margin-top: 2px; }
.go { flex: none; color: var(--dim); font-size: 20px; }
footer { margin-top: 28px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>turmony</h1>
  <p class="sub">选择要打开的网页</p>
  <ul>
    <li><a class="card" href="/review/">
      <span class="mark">日</span>
      <span class="text"><span class="name">JLPT 学习站</span><span class="desc">日语学习、试卷与新闻阅读</span></span>
      <span class="go">›</span>
    </a></li>
    <li><a class="card" href="/vpn-admin/">
      <span class="mark">V</span>
      <span class="text"><span class="name">VPN 管理</span><span class="desc">节点、用户与流量</span></span>
      <span class="go">›</span>
    </a></li>
    <li><a class="card" href="https://api.turmony.site/">
      <span class="mark">Q</span>
      <span class="text"><span class="name">Qoder 管理</span><span class="desc">qoder2api-hub 管理页</span></span>
      <span class="go">›</span>
    </a></li>
  </ul>
  <footer>各网页仍使用各自的登录方式。</footer>
</main>
</body>
</html>
