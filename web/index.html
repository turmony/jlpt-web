<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JLPT 学习册</title><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/chat.css"><script type="module" src="/practice.mjs"></script></head>
<body class="practice-body"><main class="page practice-page">
  <nav class="topbar" aria-label="学习导航"><strong>JLPT 学习册</strong><a href="/grammar/">语法记忆</a><button id="logout" type="button">退出</button></nav>
  <p id="notice" role="alert" hidden></p>
  <div id="chat-react"></div>
  <section id="chat-shell" class="chat-shell" aria-label="智能体对话">
    <aside class="chat-sidebar" aria-label="对话历史"><div class="row"><h2 id="tasks-title">对话</h2><button id="refresh" type="button">刷新</button></div><button id="new-task" type="button">新建对话</button>
      <div class="history-tabs" role="group" aria-label="对话列表筛选"><button id="show-active" type="button" aria-pressed="true">对话</button><button id="show-archived" type="button" aria-pressed="false">已归档</button></div>
      <div id="archive-feedback" class="archive-feedback" hidden><span id="archive-message" role="status"></span><button id="undo-archive" type="button">撤销</button></div><div id="tasks"></div></aside>
    <div class="chat-surface">
    <div class="chat-toolbar"><button id="toggle-conversations" class="chat-mobile-toggle" type="button" aria-expanded="false">对话列表</button><p id="conversation" class="muted">新对话</p><button id="restore-current" type="button" hidden>恢复对话</button><button id="toggle-artifacts" class="artifact-toggle" type="button" aria-expanded="false">试卷与产物</button>
    <details id="diagnostics"><summary>运行诊断</summary><div class="diagnostic-panel"><div class="diagnostic-toolbar"><button id="refresh-diagnostics" type="button">刷新诊断</button><span id="diagnostic-state" class="muted" role="status"></span></div><p id="cli-status" class="muted" role="status">正在检查执行器…</p><pre id="events" class="events"></pre></div></details></div>
    <div id="chat-messages" class="chat-history" aria-label="消息历史"></div>
    <div id="chat-timer"></div><p id="task-state" class="chat-status" role="status">选择或新建一个对话</p>
    <div class="row"><button id="cancel" type="button" disabled hidden>停止任务</button><button id="commit-retry" type="button" hidden>重试本地提交</button></div>
    <div id="chat-input"></div>
    </div>
    <aside id="artifacts-panel" class="artifact-sidebar" aria-labelledby="papers-title"><div class="row artifact-heading"><h2 id="papers-title">试卷与产物</h2><button id="close-artifacts" class="artifact-toggle" type="button">返回对话</button></div><div id="papers" class="artifact-list"></div>
    <div id="artifact-empty" class="artifact-empty muted">选择一份试卷，在这里作答或查看解析。</div>
  <section id="paper-section" class="artifact-content" hidden><h2 id="paper-title"></h2><p id="save-state" class="muted" role="status"></p>
    <div id="draft-conflict" role="alert" hidden><p>另一标签页修改了草稿。本页作答仍然保留，请选择要保存的版本。</p><div class="row"><button id="load-server-draft" type="button">读取服务器草稿</button><button id="keep-local-draft" type="button">保存本页作答</button></div></div>
    <div class="row"><button id="view-answers" type="button">查看答案与解析</button><button id="view-report" type="button" hidden>查看成绩报告</button></div>
    <details id="answer-details" hidden><summary>答案与解析</summary><pre id="answer-text"></pre></details>
    <details id="report-details" hidden><summary>成绩报告</summary><pre id="report-text"></pre></details>
    <form id="answer-form"><div id="questions"></div><button id="submit-paper" class="primary" type="submit">正式交卷并锁定答案</button></form>
  </section>
  <footer class="muted artifact-footer">草稿自动保存。每份试卷只能正式交卷一次；判卷通过后保存本地学习历史。</footer>
    </aside>
  </section>
</main></body></html>
